name: Lint, Test, and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      
      - name: Install required dependencies
        run: npm ci

      - name: Lint
        run: npm run lint 

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Execute deployment commands
        run: echo "Deploying application..."